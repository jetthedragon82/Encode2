    <!-- AUDIO DRIVER & BINARY SEGMENTATION PARSER LOGIC -->
    <script>
        // System Register States
        let loadedAmmefBuffer = null;
        let cleanAudioStartOffset = 0;

        // ==========================================
        // FILE INTAKE: Load the .ammef container
        // ==========================================
        async function handleAmmefUpload(fileList) {
            const fileObject = fileList[0];
            if (!fileObject) return;
            
            loadedAmmefBuffer = await fileObject.arrayBuffer();
            parseContainerStructure();
        }

        // Shared Parser Protocol Layer
        function parseContainerStructure() {
            const view = new DataView(loadedAmmefBuffer);
            
            // Verify binary signature validation array check ('AMME' -> 0x41, 0x4D, 0x4D, 0x45)
            const isSignatureValid = view.getUint8(0) === 0x41 && view.getUint8(1) === 0x4D && 
                                     view.getUint8(2) === 0x4D && view.getUint8(3) === 0x45;
            
            if (!isSignatureValid) {
                alert("Core Error: Selected workspace target payload is not a valid ArNet .ammef container configuration.");
                loadedAmmefBuffer = null;
                cleanAudioStartOffset = 0;
                document.getElementById('ammefFileInput').value = '';
                return;
            }
            
            // Extract the precise 32-bit byte offset where the clean unmodulated tracking stream initiates
            cleanAudioStartOffset = view.getUint32(4, true); // true indicates Little-Endian memory indexing
            console.log(`[ArNet System OS] Container Loaded. High-Fidelity speech index mapping pointer pinned to layout index byte: ${cleanAudioStartOffset}`);
        }

        // ==========================================
        // BUTTON 1: Listen Raw (Plays the Modulated Signal)
        // ==========================================
        function listenRawModulatedSignal() {
            if (!loadedAmmefBuffer) {
                alert("Operation Terminated: Please upload or construct an active .ammef container buffer mapping before activating audio hardware drivers.");
                return;
            }
            
            console.log("Routing raw un-decoded FM modulation carrier frequencies straight to sound-buffer arrays...");
            
            // Isolate payload tracking segment bounds: starts at index byte 8, truncates exactly at voice payload start point
            const rawFmBufferSlice = loadedAmmefBuffer.slice(8, cleanAudioStartOffset);
            
            sendToSpeakerBus(rawFmBufferSlice);
        }

        // ==========================================
        // BUTTON 2: Decode File (Produces Original Voice Signal)
        // ==========================================
        function decodeToOriginalVoice() {
            if (!loadedAmmefBuffer) {
                alert("Operation Terminated: Please upload or construct an active .ammef container buffer mapping before activating audio hardware drivers.");
                return;
            }
            
            console.log("Isolating high-fidelity audio stream data by bypassing primary FM signature fields...");
            
            // Extract clear transmission arrays starting at the specific offset pointer and sliding through remaining trailing registers
            const cleanVoiceBufferSlice = loadedAmmefBuffer.slice(cleanAudioStartOffset);
            
            sendToSpeakerBus(cleanVoiceBufferSlice);
        }

        // ==========================================
        // AUDIO HARDWARE LAYER: Web Audio API Playback Core Engine
        // ==========================================
        function sendToSpeakerBus(arrayBuffer) {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContextClass();
                
                // Copy internal buffer chunk securely to eliminate frame modification interference risks
                const structuralBufferCopy = arrayBuffer.slice(0);
                
                audioCtx.decodeAudioData(structuralBufferCopy, (decodedOutputBuffer) => {
                    const dynamicSourceNode = audioCtx.createBufferSource();
                    dynamicSourceNode.buffer = decodedOutputBuffer;
                    dynamicSourceNode.connect(audioCtx.destination);
                    dynamicSourceNode.start(0);
                }, (runtimeAudioDecodeError) => {

console.error("[Hardware Failure] Local PCM conversion failure on memory segment blocks: ", runtimeAudioDecodeError);
alert("Playback Engine Timeout: Unable to render selected raw binary slice into standard linear PCM speaker tracks.");
});
} catch (engineInstantiationException) {
console.error("[System Context Error] Browser environment missing audio driver configurations: ", engineInstantiationException);
}
}
// ==========================================
// SANDBOX HELPER: Dynamically Simulate An .AMMEF File Structure Without Hardware Input
// ==========================================
async function injectMockAmmefContainer() {
console.log("Generating fake dual-payload container environment metrics...");
// To prevent errors when parsing, we need mock sound frequencies.
// We use simple 1-second browser audio context tones compiled into standard audio structures.
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
async function createAudioTrackBuffer(hzValue) {
const sampleRate = audioCtx.sampleRate;
const duration = 1.0; // 1 second length tracks
const totalFrames = sampleRate * duration;
const buffer = audioCtx.createBuffer(1, totalFrames, sampleRate);
const channelData = buffer.getChannelData(0);
for (let i = 0; i < totalFrames; i++) {
channelData[i] = Math.sin(2 * Math.PI * hzValue * (i / sampleRate));
}
// Convert processing node properties back into stream arrays using a quick file conversion method
const response = await fetch(URL.createObjectURL(new Blob([bufferToWavBuffer(buffer)], {type: 'audio/wav'})));
return await response.arrayBuffer();
}
const rawFmTrack = await createAudioTrackBuffer(880); // High pitched tone mimicking an FM carrier sound wave
const cleanVoiceTrack = await createAudioTrackBuffer(330); // Warm lower frequency tone representing structural voice signals
// Constructing file architecture structures manually
const headerSize = 8;
const cleanAudioOffset = headerSize + rawFmTrack.byteLength;
const containerHeaderBuffer = new ArrayBuffer(headerSize);
const dataView = new DataView(containerHeaderBuffer);
// Stamp identity flags: 'AMME' ASCII
dataView.setUint8(0, 0x41); dataView.setUint8(1, 0x4D); dataView.setUint8(2, 0x4D); dataView.setUint8(3, 0x45);
// Pin offset tracking mapping marker address
dataView.setUint32(4, cleanAudioOffset, true);
// Stitch items structurally together
const compositeBlob = new Blob([containerHeaderBuffer, rawFmTrack, cleanVoiceTrack]);
loadedAmmefBuffer = await compositeBlob.arrayBuffer();
parseContainerStructure();
alert("Sandbox Matrix Active: Synthetic testing .ammef setup compiled directly into execution loops successfully!");
}
// Minimalistic AudioBuffer to WAV ArrayBuffer processing algorithm for simulated tests
function bufferToWavBuffer(audioBuffer) {
let numOfChan = audioBuffer.numberOfChannels,
length = audioBuffer.length * numOfChan * 2 + 44,
buffer = new ArrayBuffer(length),
view = new DataView(buffer),
channels = [], i, sample,
offset = 0,
pos = 0;
function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
setUint32(0x46464952); // "RIFF"
setUint32(length - 8); // file length - 8
setUint32(0x45564157); // "WAVE"
setUint32(0x20746d66); // "fmt " chunk
setUint32(16); // chunk length
setUint16(1); // sample format (raw)
setUint16(numOfChan);
setUint32(audioBuffer.sampleRate);
setUint32(audioBuffer.sampleRate * 2 * numOfChan); // byte rate
setUint16(numOfChan * 2); // block align
setUint16(16); // bits per sample
setUint32(0x61746164); // "data" chunk
setUint32(length - pos - 4); // chunk length
for(i=0; i<audioBuffer.numberOfChannels; i++) channels.push(audioBuffer.getChannelData(i));
while(pos < length) {
for(i=0; i<numOfChan; i++) {
sample = Math.max(-1, Math.min(1, channels[i][offset]));
sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
view.setInt16(pos, sample, true); pos += 2;
}
offset++;
}
return buffer;
}
